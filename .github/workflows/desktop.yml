name: Desktop tests and builds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - run: python -m pip install -r requirements-build.txt
      - name: Regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - run: python build_app.py
      - name: Packaged startup
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_package.py
      - name: Native platform startup
        if: runner.os != 'Linux'
        run: python scripts/smoke_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidVisualAutoclicker-${{ runner.os }}-${{ runner.arch }}
          path: dist/
